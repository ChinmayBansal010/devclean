name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            c_compiler: gcc-13
            cxx_compiler: g++-13
          - os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq g++-13 cmake ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install ninja

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
        else
          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
        fi

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel
    
    - name: Test
      working-directory: build
      run: ctest --output-on-failure --build-config ${{ matrix.build_type }} --timeout 30 -V

    - name: Install
      run: cmake --install build --config ${{ matrix.build_type }}

  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq g++-13 cmake ninja-build

    - name: Configure with sanitizers
      run: >
        cmake -B build
        -G Ninja
        -DCMAKE_C_COMPILER=gcc-13
        -DCMAKE_CXX_COMPILER=g++-13
        -DCMAKE_BUILD_TYPE=Debug
        -DENABLE_SANITIZERS=ON

    - name: Build
      run: cmake --build build --parallel

    - name: Test with sanitizers
      working-directory: build
      run: ctest --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq g++-13 cmake ninja-build clang-tidy clang-tools cppcheck

    - name: Configure CMake
      run: >
        cmake -B build
        -G Ninja
        -DCMAKE_C_COMPILER=gcc-13
        -DCMAKE_CXX_COMPILER=g++-13
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build (for compile_commands.json)
      run: cmake --build build --parallel

    - name: Run clang-tidy
      run: |
        cd build
        find ../src ../include \( -name '*.cpp' -o -name '*.hpp' \) | \
        xargs clang-tidy -p .

    - name: Run cppcheck
      run: |
        find src include tests \
          \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) \
          -print0 | xargs -0 cppcheck \
          --enable=warning,portability \
          --std=c++23 \
          --error-exitcode=1 \
          --inline-suppr
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq g++-13 cmake ninja-build rpm

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install ninja

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        choco install ninja -y

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
        else
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
        fi

    - name: Build
      run: cmake --build build --parallel

    - name: Package
      working-directory: build
      run: cpack -B cpack-output

    - name: Stage artifacts
      shell: bash
      run: |
        mkdir -p release-artifacts/${{ matrix.os }}
        find build/cpack-output -type f \
          \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.msi" -o -name "*.pkg" \) \
          -exec cp {} release-artifacts/${{ matrix.os }}/ \; 2>/dev/null || true

    - uses: actions/upload-artifact@v4
      with:
        name: devclean-packages-${{ matrix.os }}
        path: release-artifacts/${{ matrix.os }}
        if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 1
    - uses: actions/download-artifact@v4
      with:
        path: release-artifacts
        merge-multiple: true

    - name: Generate release manifest
      shell: bash
      run: |
        {
          echo "# devclean v${{ github.ref_name }}"
          echo
          find release-artifacts -type f | sort | while read file; do
            echo "- $(basename "$file")"
          done
        } > release-manifest.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: CHANGELOG.md
        files: |
          release-artifacts/*
          release-manifest.txt
        fail_on_unmatched_files: false